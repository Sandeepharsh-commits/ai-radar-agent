name: Daily AI Radar Digest

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST
    - cron: "30 2 * * 1-5"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

# Prevent two runs from updating agent_state.json at the same time
concurrency:
  group: ai-radar-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. Run AI Radar Agent
      # ============================================================
      - name: Run AI Radar Agent
        env:
          # --------------------------------------------------------
          # Azure OpenAI / Foundry
          # --------------------------------------------------------
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}

          # --------------------------------------------------------
          # Gmail
          # --------------------------------------------------------
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

        run: |
          python run_digest.py


      # ============================================================
      # 5. Show state information
      # ============================================================
      - name: Verify agent state
        run: |
          echo "Checking agent_state.json..."

          if [ -f agent_state.json ]; then
            echo "agent_state.json exists."

            echo "File size:"
            wc -c agent_state.json

            echo "Seen links:"
            python - <<'PY'
          import json

          with open("agent_state.json", "r", encoding="utf-8") as f:
              state = json.load(f)

          print("Seen links:", len(state.get("seen_links", [])))
          print("Page hashes:", len(state.get("page_hashes", {})))
          PY

          else
            echo "ERROR: agent_state.json was not created."
            exit 1
          fi


      # ============================================================
      # 6. Persist agent state back to GitHub
      # ============================================================
      - name: Persist seen-state
        run: |
          git config user.name "ai-radar-agent"
          git config user.email "ai-radar-agent@users.noreply.github.com"

          echo "Adding agent_state.json..."
          git add agent_state.json

          # Nothing changed
          if git diff --cached --quiet; then
            echo "No state changes detected."
            exit 0
          fi

          echo "Creating state commit..."
          git commit -m "state: $(date -u +%F)"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Rebasing local state commit onto latest main..."
          git rebase origin/main

          echo "Pushing updated state..."
          git push origin HEAD:main

          echo "State successfully persisted."
